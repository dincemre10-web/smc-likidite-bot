name: SMC Likidite Telegram Tarayici

on:
  schedule:
    - cron: "*/10 * * * 1-5" # Pazartesi-Cuma her 10 dakikada bir tarar
  workflow_dispatch:       # Manuel test butonu

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri Yukle
        run: pip install yfinance pandas requests

      - name: SMC Tarayiciyi Calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Bildirim Gecmisini Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update alert state"
            git pull --rebase origin main
            git push
          fi
